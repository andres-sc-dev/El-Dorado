name: eldorado

# Seis servicios: cuatro bases (sqlserver, mysql, postgres, mongo), backend y frontend.
# Además, db-init es un contenedor de un solo uso que crea el esquema de SQL Server,
# porque SQL Server no ejecuta scripts de inicio por su cuenta.
# Los valores salen del archivo .env de la raíz (ver .env.example).
# Los puertos de las bases se publican solo en 127.0.0.1 para poder usar DBeaver o similares.

x-db-healthcheck: &db-healthcheck
  interval: 10s
  timeout: 5s
  retries: 30

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eldorado-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer            # Edición gratuita para desarrollo.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"   # Deja memoria para los otros motores (Docker tiene 8 GB).
    ports:
      - "127.0.0.1:${SQLSERVER_HOST_PORT:-14333}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks: [eldorado]
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      start_period: 40s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eldorado-db-init
    entrypoint: ["/bin/bash", "/scripts/run-init.sh"]
    environment:
      SQLSERVER_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
      SQLSERVER_USER: ${SQLSERVER_USER:?Define SQLSERVER_USER en .env}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:?Define SQLSERVER_PASSWORD en .env}
    volumes:
      - ./database/sqlserver:/scripts:ro
    networks: [eldorado]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  mysql:
    image: mysql:8
    container_name: eldorado-mysql
    environment:
      MYSQL_DATABASE: el_dorado
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    networks: [eldorado]
    healthcheck:
      <<: *db-healthcheck
      # Por TCP (127.0.0.1): durante la carga inicial MySQL solo escucha por socket,
      # así el servicio no se marca sano antes de terminar los scripts.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1 FROM el_dorado.match_status LIMIT 1' el_dorado"]
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: eldorado-postgres
    environment:
      POSTGRES_DB: el_dorado
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
    networks: [eldorado]
    healthcheck:
      <<: *db-healthcheck
      # -h 127.0.0.1 por la misma razón que en MySQL.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d el_dorado"]
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: eldorado-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Define MONGO_INITDB_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Define MONGO_INITDB_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: el_dorado
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27027}:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo:/docker-entrypoint-initdb.d:ro
    networks: [eldorado]
    healthcheck:
      <<: *db-healthcheck
      # Sano solo cuando el script de inicio ya creó la colección audit_log.
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"quit(db.getSiblingDB('el_dorado').getCollectionNames().includes('audit_log') ? 0 : 1)\""]
      start_period: 20s

  backend:
    image: node:22-alpine
    container_name: eldorado-backend
    working_dir: /app
    # La semilla de demo corre en cada arranque (es idempotente). Si falla, el servidor arranca igual.
    command: sh -c "npm ci && (npm run seed:demo || echo 'seed:demo falló; el servidor arranca igual') && npm run dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      PORT: 4000
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      CORS_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-5173}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: 1433
      SQLSERVER_DB: el_dorado
      SQLSERVER_USER: ${SQLSERVER_USER}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: el_dorado
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: el_dorado
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: el_dorado
      DEMO_USERNAME: ${DEMO_USERNAME:?Define DEMO_USERNAME en .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Define DEMO_PASSWORD en .env}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_FULL_NAME: ${DEMO_FULL_NAME:-}
      DEMO_DOCUMENT: ${DEMO_DOCUMENT:-}
      DEMO_BALANCE: ${DEMO_BALANCE:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DOCUMENT: ${ADMIN_DOCUMENT:-}
      BET_MIN_COP: ${BET_MIN_COP:-1000}
      BET_MAX_COP: ${BET_MAX_COP:-500000}
      # Wompi: SOLO llaves de Sandbox (pub_test_, prv_test_, test_events_, test_integrity_).
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-}
      WOMPI_API_URL: ${WOMPI_API_URL:-https://sandbox.wompi.co/v1}
      WOMPI_MIN_COP: ${WOMPI_MIN_COP:-10000}
      WOMPI_MAX_COP: ${WOMPI_MAX_COP:-3000000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    ports:
      - "${BACKEND_HOST_PORT:-4000}:4000"
    networks: [eldorado]
    depends_on:
      db-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    image: node:22-alpine
    container_name: eldorado-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
      # Recarga en caliente en Docker sobre Windows (ver vite.config.js).
      VITE_USE_POLLING: "true"
      # Llave pública de Wompi Sandbox para el Widget (es pública: puede ir al navegador).
      VITE_WOMPI_PUBLIC_KEY: ${VITE_WOMPI_PUBLIC_KEY:-}
      # Configuración web PÚBLICA de Firebase para "Continuar con Google" (no son secretos).
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    networks: [eldorado]
    depends_on:
      backend:
        condition: service_healthy

networks:
  eldorado:
    name: eldorado_net
    driver: bridge

volumes:
  sqlserver_data:
  mysql_data:
  postgres_data:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
